{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}">
  <style>
    .operations-shell { display:grid; grid-template-columns:minmax(0,1fr) 360px; min-height:680px; border:1px solid #e5e7eb; background:#fff; }
    .map-stage { position:relative; min-width:0; }
    #operations-map { min-height:680px; background:#dbe4e6; }
    .map-tools { position:absolute; z-index:500; top:12px; right:12px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .map-tool { border:1px solid #cbd5e1; border-radius:6px; padding:8px 11px; background:#fff; color:#0f172a; box-shadow:0 1px 4px rgba(15,23,42,.16); cursor:pointer; font-size:12px; font-weight:700; }
    .map-tool.is-active { background:#0f62fe; border-color:#0f62fe; color:#fff; }
    .map-status { position:absolute; z-index:500; left:12px; bottom:24px; padding:7px 10px; border-radius:6px; background:rgba(15,23,42,.88); color:#fff; font-size:12px; pointer-events:none; }
    .poi-label { background:rgba(255,255,255,.94); border:1px solid #cbd5e1; border-radius:4px; box-shadow:0 1px 3px rgba(15,23,42,.16); color:#0f172a; font-size:11px; font-weight:700; padding:3px 6px; }
    .poi-label::before { display:none; }
    .operations-rail { border-left:1px solid #e5e7eb; overflow:auto; max-height:680px; }
    .operations-head { padding:18px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; justify-content:space-between; }
    .operations-head h2 { margin:0; font-size:16px; font-weight:700; }
    .live-dot { width:8px; height:8px; border-radius:50%; background:#16a34a; display:inline-block; margin-right:7px; }
    .session-card { padding:18px 20px; border-bottom:1px solid #e5e7eb; }
    .session-card.is-emergency { border-left:4px solid #dc2626; }
    .session-title { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .session-title strong { display:block; font-size:14px; }
    .session-title small, .session-meta { color:#64748b; font-size:12px; }
    .badge { padding:3px 7px; border-radius:4px; font-size:11px; font-weight:700; background:#dcfce7; color:#166534; }
    .badge.danger { background:#fee2e2; color:#991b1b; }
    .session-meta { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:12px; }
    .agency-select { width:100%; min-height:86px; border:1px solid #cbd5e1; border-radius:6px; padding:7px; background:#fff; color:#0f172a; }
    .assign-button { width:100%; margin-top:8px; border:0; border-radius:6px; padding:9px 12px; background:#0f62fe; color:white; font-weight:700; cursor:pointer; }
    .session-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .session-action { border:1px solid #cbd5e1; border-radius:6px; padding:8px 10px; background:#fff; color:#0f172a; cursor:pointer; font-size:12px; font-weight:700; }
    .session-action.following { background:#dcfce7; border-color:#86efac; color:#166534; }
    .empty-state { padding:48px 24px; text-align:center; color:#64748b; }
    .leaflet-popup-content strong { font-size:14px; }
    @media (max-width: 900px) { .operations-shell { grid-template-columns:1fr; } #operations-map { min-height:440px; } .operations-rail { border-left:0; border-top:1px solid #e5e7eb; max-height:none; } }
    .dark .operations-shell, .dark .agency-select, .dark .map-tool, .dark .session-action { background:#111827; color:#e5e7eb; border-color:#374151; }
    .dark .operations-rail, .dark .operations-head, .dark .session-card { border-color:#374151; }
  </style>
{% endblock %}

{% block content %}
  <div class="operations-shell">
    <div class="map-stage">
      <div id="operations-map" aria-label="Detailed live tracking street map"></div>
      <div class="map-tools">
        <button class="map-tool" id="show-all" type="button">Show all users</button>
        <button class="map-tool" id="street-zoom" type="button">Street detail</button>
        <button class="map-tool" id="map-mode" type="button">Satellite</button>
        <button class="map-tool is-active" id="places-toggle" type="button">Places: on</button>
        <button class="map-tool" id="follow-toggle" type="button">Follow selected: off</button>
      </div>
      <div class="map-status" id="map-status">Street map · zoom in for buildings and landmarks</div>
    </div>
    <aside class="operations-rail">
      <div class="operations-head">
        <h2><span class="live-dot"></span>Active tracking</h2>
        <span id="session-count">0 users</span>
      </div>
      <div id="session-list"><div class="empty-state">Loading active sessions...</div></div>
    </aside>
  </div>
{% endblock %}

{% block footer %}
  {{ block.super }}
  <script src="{% static 'vendor/leaflet/leaflet.js' %}"></script>
  <script>
    const map = L.map('operations-map', {
      zoomControl: true,
      zoomSnap: 1,
      zoomDelta: 1,
      maxZoom: 20
    }).setView([9.082, 8.6753], 6);
    const streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxNativeZoom: 19,
      maxZoom: 20,
      keepBuffer: 4,
      updateWhenIdle: true,
      updateWhenZooming: false,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    const satelliteLayer = L.tileLayer(
      'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxNativeZoom: 19,
        maxZoom: 20,
        keepBuffer: 4,
        updateWhenIdle: true,
        updateWhenZooming: false,
        attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community'
      }
    );
    let satelliteMode = false;
    let streetTilesReady = false;
    streetLayer.on('tileload', () => {
      if (streetTilesReady) return;
      streetTilesReady = true;
      document.getElementById('map-status').textContent = 'Street map ready · zoom in for names, buildings, and landmarks';
    });
    streetLayer.on('tileerror', () => {
      document.getElementById('map-status').textContent = 'Street tiles could not load. Check network access to tile.openstreetmap.org.';
    });
    satelliteLayer.on('tileerror', () => {
      if (!satelliteMode) return;
      satelliteMode = false;
      map.removeLayer(satelliteLayer);
      streetLayer.addTo(map);
      const modeButton = document.getElementById('map-mode');
      modeButton.classList.remove('is-active');
      modeButton.textContent = 'Satellite';
      document.getElementById('map-status').textContent = 'Satellite imagery is unavailable. Street map restored.';
    });
    L.control.scale({ imperial: false }).addTo(map);
    map.on('zoomend', () => {
      if (followSelected) return;
      const zoom = map.getZoom();
      document.getElementById('map-status').textContent = zoom >= 17
        ? `Street detail level ${zoom} · buildings and nearby landmarks`
        : `Map zoom ${zoom} · use Street detail for road names and buildings`;
      schedulePlaces();
    });
    map.on('moveend', schedulePlaces);

    const markers = new Map();
    const trails = new Map();
    const trailPoints = new Map();
    const poiLayer = L.layerGroup().addTo(map);
    let placesEnabled = true;
    let placesTimer = null;
    let placesRequest = null;
    let placesCacheKey = '';
    let selectedSessionId = null;
    let followSelected = false;
    let latestSessions = [];
    const organizations = [
      {% for organization in organizations %}{ id: {{ organization.id }}, name: '{{ organization.name|escapejs }}' },{% endfor %}
    ];

    function escapeHtml(value) {
      const node = document.createElement('div');
      node.textContent = value ?? '';
      return node.innerHTML;
    }

    const placeStyles = {
      hospital: ['Hospital', '#dc2626'],
      clinic: ['Clinic', '#e11d48'],
      doctors: ['Doctor', '#e11d48'],
      pharmacy: ['Pharmacy', '#16a34a'],
      fuel: ['Fuel station', '#ea580c'],
      police: ['Police', '#2563eb'],
      fire_station: ['Fire station', '#b91c1c'],
      townhall: ['Town hall', '#7c3aed'],
      community_centre: ['Community hall', '#7c3aed'],
      social_centre: ['Social centre', '#7c3aed'],
      events_venue: ['Event hall', '#9333ea'],
      conference_centre: ['Conference hall', '#9333ea'],
      school: ['School', '#0891b2'],
      college: ['College', '#0891b2'],
      university: ['University', '#0891b2'],
      attraction: ['Landmark', '#ca8a04'],
      museum: ['Museum', '#ca8a04'],
      gallery: ['Gallery', '#ca8a04'],
      historic: ['Historic landmark', '#a16207']
    };

    function placeType(tags) {
      if (tags.amenity) return tags.amenity;
      if (tags.tourism) return tags.tourism;
      if (tags.historic) return 'historic';
      return 'attraction';
    }

    function schedulePlaces() {
      clearTimeout(placesTimer);
      placesTimer = setTimeout(loadVisiblePlaces, 350);
    }

    async function loadVisiblePlaces() {
      if (!placesEnabled) return;
      if (map.getZoom() < 14) {
        poiLayer.clearLayers();
        placesCacheKey = '';
        document.getElementById('map-status').textContent = 'Zoom to level 14 or use Street detail to load nearby places.';
        return;
      }

      const bounds = map.getBounds();
      const gridSize = .01;
      const bbox = [
        Math.floor(bounds.getSouth() / gridSize) * gridSize,
        Math.floor(bounds.getWest() / gridSize) * gridSize,
        Math.ceil(bounds.getNorth() / gridSize) * gridSize,
        Math.ceil(bounds.getEast() / gridSize) * gridSize
      ].map(value => value.toFixed(2)).join(',');
      const cacheKey = bbox;
      if (cacheKey === placesCacheKey) return;

      placesRequest?.abort();
      placesRequest = new AbortController();
      document.getElementById('map-status').textContent = 'Loading hospitals, fuel stations, halls, and landmarks...';

      try {
        const response = await fetch(`{{ places_url }}?bbox=${encodeURIComponent(bbox)}`, {
          signal: placesRequest.signal,
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        poiLayer.clearLayers();
        let shown = 0;

        data.elements.forEach(element => {
          const latitude = element.lat ?? element.center?.lat;
          const longitude = element.lon ?? element.center?.lon;
          if (latitude == null || longitude == null) return;
          const tags = element.tags || {};
          const type = placeType(tags);
          const style = placeStyles[type] || ['Landmark', '#ca8a04'];
          const name = tags.name || style[0];
          const marker = L.circleMarker([latitude, longitude], {
            radius: 6,
            color: '#fff',
            weight: 2,
            fillColor: style[1],
            fillOpacity: .96
          }).bindPopup(`<strong>${escapeHtml(name)}</strong><br>${escapeHtml(style[0])}`);
          marker.bindTooltip(escapeHtml(name), {
            permanent: map.getZoom() >= 15,
            direction: 'top',
            offset: [0, -7],
            className: 'poi-label'
          });
          marker.addTo(poiLayer);
          shown += 1;
        });

        placesCacheKey = cacheKey;
        document.getElementById('map-status').textContent = `${shown} nearby places visible · zoom ${map.getZoom()}`;
      } catch (error) {
        if (error.name === 'AbortError') return;
        document.getElementById('map-status').textContent = 'Nearby places could not load; the street map remains available.';
      }
    }

    function renderSessions(sessions) {
      latestSessions = sessions;
      const list = document.getElementById('session-list');
      document.getElementById('session-count').textContent = `${sessions.length} user${sessions.length === 1 ? '' : 's'}`;
      list.innerHTML = sessions.length ? '' : '<div class="empty-state">No active tracking sessions.</div>';
      const activeIds = new Set();

      sessions.forEach(session => {
        activeIds.add(session.id);
        const assignedIds = new Set(session.organizations.map(item => item.id));
        const options = organizations.map(org => `<option value="${org.id}" ${assignedIds.has(org.id) ? 'selected' : ''}>${escapeHtml(org.name)}</option>`).join('');
        const card = document.createElement('section');
        card.className = `session-card ${session.emergency ? 'is-emergency' : ''}`;
        card.innerHTML = `
          <div class="session-title"><div><strong>${escapeHtml(session.user)}</strong><small>@${escapeHtml(session.username)} · Session ${session.id}</small></div><span class="badge ${session.emergency ? 'danger' : ''}">${session.emergency ? 'SOS' : 'ACTIVE'}</span></div>
          <div class="session-meta"><span>Accuracy: ${session.accuracy ?? '—'} m</span><span>Speed: ${session.speed ?? '—'} m/s</span><span>Heading: ${session.heading ?? '—'}°</span><span>${new Date(session.updated_at).toLocaleTimeString()}</span></div>
          <div class="session-actions"><button class="session-action view-user" type="button">View on map</button><button class="session-action follow-user ${selectedSessionId === session.id && followSelected ? 'following' : ''}" type="button">${selectedSessionId === session.id && followSelected ? 'Following' : 'Follow movement'}</button></div>
          <form method="post" action="{{ assign_url }}">{% csrf_token %}<input type="hidden" name="session_id" value="${session.id}"><label><strong>Monitoring agencies</strong></label><select class="agency-select" name="organization_ids" multiple>${options}</select><button class="assign-button" type="submit">Update assignment</button></form>`;
        card.querySelector('.view-user').addEventListener('click', () => focusSession(session.id, false));
        card.querySelector('.follow-user').addEventListener('click', () => focusSession(session.id, true));
        list.appendChild(card);

        if (session.latitude !== null && session.longitude !== null) {
          const point = [session.latitude, session.longitude];
          const popup = `<strong>${escapeHtml(session.user)}</strong><br>Session ${session.id}${session.emergency ? '<br><b>SOS active</b>' : ''}`;
          if (markers.has(session.id)) {
            markers.get(session.id).setLatLng(point).setPopupContent(popup);
          } else {
            const marker = L.marker(point, { title: session.user }).addTo(map).bindPopup(popup);
            marker.on('click', () => { selectedSessionId = session.id; updateFollowButton(); });
            markers.set(session.id, marker);
          }

          const points = trailPoints.get(session.id) || [];
          const last = points[points.length - 1];
          if (!last || last[0] !== point[0] || last[1] !== point[1]) {
            points.push(point);
            if (points.length > 30) points.shift();
            trailPoints.set(session.id, points);
            if (trails.has(session.id)) trails.get(session.id).setLatLngs(points);
            else trails.set(session.id, L.polyline(points, { color: session.emergency ? '#dc2626' : '#0f62fe', weight: 4, opacity: .72 }).addTo(map));
          }

          if (followSelected && selectedSessionId === session.id) {
            map.panTo(point, { animate: true, duration: .7 });
            document.getElementById('map-status').textContent = `Following ${session.user} · updated ${new Date(session.updated_at).toLocaleTimeString()}`;
          }
        }
      });

      markers.forEach((marker, id) => {
        if (!activeIds.has(id)) {
          map.removeLayer(marker);
          markers.delete(id);
          if (trails.has(id)) map.removeLayer(trails.get(id));
          trails.delete(id);
          trailPoints.delete(id);
          if (selectedSessionId === id) { selectedSessionId = null; followSelected = false; updateFollowButton(); }
        }
      });
      const located = sessions.filter(item => item.latitude !== null && item.longitude !== null);
      if (located.length && !map._navigoFitted) {
        map.fitBounds(located.map(item => [item.latitude, item.longitude]), { padding: [36, 36], maxZoom: 15 });
        map._navigoFitted = true;
      }
    }

    function locatedSession(sessionId) {
      return latestSessions.find(item => item.id === sessionId && item.latitude !== null && item.longitude !== null);
    }

    function focusSession(sessionId, follow) {
      const session = locatedSession(sessionId);
      if (!session) {
        document.getElementById('map-status').textContent = 'This user has not published a location yet.';
        return;
      }
      selectedSessionId = sessionId;
      followSelected = follow;
      map.flyTo([session.latitude, session.longitude], 18, { animate: true, duration: 1 });
      markers.get(sessionId)?.openPopup();
      document.getElementById('map-status').textContent = `${follow ? 'Following' : 'Viewing'} ${session.user} · street and building detail`;
      updateFollowButton();
      renderSessions(latestSessions);
    }

    function updateFollowButton() {
      const button = document.getElementById('follow-toggle');
      button.classList.toggle('is-active', followSelected);
      button.textContent = `Follow selected: ${followSelected ? 'on' : 'off'}`;
    }

    function showAllUsers() {
      const located = latestSessions.filter(item => item.latitude !== null && item.longitude !== null);
      followSelected = false;
      updateFollowButton();
      if (located.length) map.fitBounds(located.map(item => [item.latitude, item.longitude]), { padding: [48, 48], maxZoom: 16 });
      document.getElementById('map-status').textContent = 'Showing all active users';
    }

    document.getElementById('show-all').addEventListener('click', showAllUsers);
    document.getElementById('street-zoom').addEventListener('click', () => {
      if (selectedSessionId !== null) focusSession(selectedSessionId, followSelected);
      else map.setZoom(Math.max(map.getZoom(), 18));
    });
    document.getElementById('map-mode').addEventListener('click', event => {
      satelliteMode = !satelliteMode;
      if (satelliteMode) {
        map.removeLayer(streetLayer);
        satelliteLayer.addTo(map);
      } else {
        map.removeLayer(satelliteLayer);
        streetLayer.addTo(map);
      }
      event.currentTarget.classList.toggle('is-active', satelliteMode);
      event.currentTarget.textContent = satelliteMode ? 'Streets' : 'Satellite';
      document.getElementById('map-status').textContent = satelliteMode
        ? 'Satellite imagery active · live users and nearby places remain visible'
        : 'Street map active · road and building labels visible';
    });
    document.getElementById('places-toggle').addEventListener('click', event => {
      placesEnabled = !placesEnabled;
      event.currentTarget.classList.toggle('is-active', placesEnabled);
      event.currentTarget.textContent = `Places: ${placesEnabled ? 'on' : 'off'}`;
      if (placesEnabled) {
        placesCacheKey = '';
        schedulePlaces();
      } else {
        placesRequest?.abort();
        poiLayer.clearLayers();
        document.getElementById('map-status').textContent = 'Nearby places hidden';
      }
    });
    document.getElementById('follow-toggle').addEventListener('click', () => {
      if (selectedSessionId === null && latestSessions.length) selectedSessionId = latestSessions[0].id;
      followSelected = !followSelected;
      updateFollowButton();
      if (selectedSessionId !== null) focusSession(selectedSessionId, followSelected);
    });

    async function refreshSessions() {
      try {
        const response = await fetch('{{ data_url }}', { credentials: 'same-origin' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderSessions((await response.json()).sessions);
      } catch (error) {
        document.getElementById('session-list').innerHTML = '<div class="empty-state">Unable to refresh live sessions.</div>';
      }
    }

    refreshSessions();
    setTimeout(() => map.invalidateSize(), 0);
    schedulePlaces();
    setInterval(refreshSessions, 2000);
  </script>
{% endblock %}
