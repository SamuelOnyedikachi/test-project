services:
  backend:
    build:
      context: ./navigo-locate-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./navigo-locate-app:/app

  db:
    image: postgis/postgis:17-3.5
    profiles:
      - local-db
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-navigo}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-navigo}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-navigo}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-navigo} -d ${LOCAL_POSTGRES_DB:-navigo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
